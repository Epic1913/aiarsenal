[package]
name = "aiarsenal-client-win"
version = "0.1.0"
description = "AI Arsenal 桌面客户端（Windows）"
edition = "2021"

[lib]
name = "aiarsenal_client_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tokio = { version = "1", features = ["time", "macros", "sync"] }
# native-tls（schannel 系统绑定，无 C 编译）：ring 在 windows+aarch64 强制要 clang
# （build.rs 钉死 c.compiler("clang")），本机无 clang 可装，故 win 走 schannel。
aiarsenal-client-core = { path = "../../shared/rust", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"
sha2 = "0.10"

[features]
default = ["custom-protocol", "agent-openclaw", "agent-hermes", "agent-obsidian"]
custom-protocol = ["tauri/custom-protocol"]
# 按需打包 agent：build.sh --agents 选哪些编译进二进制（未选的落 dispatch fallback）。
# win 无 openclaw-desktop（win 走 npm 全局包，不像 mac 有 desktop node 替代 App）。
agent-openclaw = []
agent-hermes = []
agent-obsidian = []
